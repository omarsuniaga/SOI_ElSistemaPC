  <style>
    /* ── SOI Premium Dark Splash Screen ── */
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #020617;
      color: #f8fafc;
      overflow-x: hidden;
    }

    #app, #portal-app {
      min-height: 100vh;
    }

    .pm-loading-splash, #pm-loading-splash, .admin-loader-container {
      position: fixed;
      inset: 0;
      z-index: 99999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 35%, #1e1b4b 0%, #0f172a 60%, #020617 100%);
      padding: 2rem;
      text-align: center;
      user-select: none;
    }

    .soi-splash-logo-wrap {
      width: 78px;
      height: 78px;
      margin-bottom: 24px;
      animation: soi-breathe 2.4s ease-in-out infinite;
      position: relative;
    }

    .soi-splash-logo-svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 0 20px rgba(139, 92, 246, 0.55));
    }

    .soi-splash-title {
      color: #ffffff;
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }

    .soi-splash-subtitle {
      color: #94a3b8;
      font-size: 0.84rem;
      font-weight: 400;
      letter-spacing: 0.01em;
      margin-bottom: 24px;
    }

    .soi-splash-progress-track {
      width: 180px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.4);
    }

    .soi-splash-progress-bar {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #6366f1 0%, #a855f7 50%, #38bdf8 100%);
      border-radius: 999px;
      animation: soi-indeterminate 1.6s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      box-shadow: 0 0 10px rgba(168, 85, 247, 0.8);
    }

    .soi-splash-status {
      color: #64748b;
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.02em;
    }

    @keyframes soi-breathe {
      0%, 100% {
        transform: scale(0.96);
        opacity: 0.9;
        filter: drop-shadow(0 0 14px rgba(139, 92, 246, 0.4));
      }
      50% {
        transform: scale(1.03);
        opacity: 1;
        filter: drop-shadow(0 0 28px rgba(139, 92, 246, 0.75));
      }
    }

    @keyframes soi-indeterminate {
      0% {
        transform: translateX(-120%) scaleX(0.7);
      }
      50% {
        transform: translateX(60%) scaleX(1.1);
      }
      100% {
        transform: translateX(240%) scaleX(0.7);
      }
    }
  </style>
</head>
<body>
  <a href="#portal-app" class="pm-skip-link">Saltar al contenido principal</a>

      <div class="pm-loading-splash" id="pm-loading-splash">

        <svg class="soi-splash-logo-svg" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="soiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#4f46e5" />
              <stop offset="50%" stop-color="#7c3aed" />
              <stop offset="100%" stop-color="#c026d3" />
            </linearGradient>
          </defs>
          <rect width="72" height="72" rx="20" fill="url(#soiGrad)" />
          <text x="30" y="49" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle">S</text>
          <circle cx="51" cy="25" r="4.5" stroke="#ffffff" stroke-width="3" fill="none" />
        </svg>
      </div>
      <div class="soi-splash-title">Sistema Operativo Institucional</div>
      <div class="soi-splash-subtitle">Portal de Maestros</div>
      <div class="soi-splash-progress-track">
        <div class="soi-splash-progress-bar"></div>
      </div>
      <div class="soi-splash-status">Sincronizando sesión y datos institucionales...</div>
    </div>
  </div>

  <div id="portal-app" tabindex="-1"></div>

  <script type="module" src="/src/main-maestros.js"></script>
