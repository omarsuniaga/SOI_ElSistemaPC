user_decisions:
  - Contador = ausencias injustificadas acumuladas en el período académico vigente.
  - "Contador por DÍA, no por sesión: 2 faltas el mismo día = 1."
  - Niveles 1 (>=1) aviso cálido / 2 (>=2) institucional / 3 (>=3) retención de instrumento. Umbrales en seguimiento_reglas.
  - Envío WhatsApp MANUAL con link wa.me (operador revisa y envía). NO automático por HERMES.
  - Portal ACM opera (acciones), ADM consulta (solo lectura + KPIs).
  - "Retención N3: tabla retenciones_instrumento keyed por alumno_id (NO depende del inventario instrumentos, 3 filas). + notificación wa.me al maestro. Representante recibe instrucciones para desbloquear firmando acta."

