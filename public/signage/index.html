<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Cartelera · El Sistema Punta Cana</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="app" class="app">
    <div class="app__grid">
      <div class="mount" id="mount-cabecera"></div>
      <div class="mount" id="mount-visualizador"></div>
      <div class="mount" id="mount-horario"></div>
    </div>

    <div class="flag-offline" id="flag-offline" hidden>Mostrando información guardada</div>

    <div class="reposo" id="reposo" hidden>
      <div class="reposo__mark">✳</div>
      <div class="reposo__time" id="reposo-time">--:--</div>
      <div class="reposo__date" id="reposo-date"></div>
    </div>

    <div class="boot" id="boot">
      <div class="boot__mark">✳</div>
      <div class="boot__bar"><span></span></div>
      <p>Cargando cartelera…</p>
    </div>

    <div class="boot" id="no-autorizado" hidden>
      <div class="boot__mark">✳</div>
      <p>Esta cartelera se administra desde el portal de El Sistema Punta Cana.</p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <!-- device.js solo existe en la Raspberry (lo escribe deploy-signage-pi.sh);
       en Netlify da 404 y no pasa nada. Marca esta copia como "dispositivo". -->
  <script src="device.js" onerror="void 0"></script>
  <!-- build.js: sello de versión (lo genera scripts/stamp-signage-build.js en el
       build de Netlify y deploy-signage-pi.sh en la Raspberry). El overlay de
       diagnóstico lo muestra para saber qué build corre cada pantalla. -->
  <script src="build.js" onerror="void 0"></script>
  <script src="js/core.js"></script>
  <script src="js/components/cabecera.js"></script>
  <script src="js/components/slide.js"></script>
  <script src="js/components/visualizador.js"></script>
  <script src="js/components/horario.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
