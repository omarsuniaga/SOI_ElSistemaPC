[build]
  command = "npm run build"
  publish = "dist"
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ':!docs' ':!*.md' ':!AGENTS.md' ':!.github'"

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # SAMEORIGIN (no DENY): el Estudio de la cartelera embebe /signage/ en un
    # iframe del mismo origen. Sigue bloqueando el enmarcado desde otros dominios.
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Keep this in sync with vite.config.js and public/_headers. Ollama runs on the developer's host.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.groq.com https://openrouter.ai https://docs.google.com http://localhost:11434 ws://localhost:11434; frame-src 'self' blob: data:; frame-ancestors 'self'"

[[headers]]
  for = "/signage/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "no-referrer"

[[redirects]]
  from = "/maestros.html"
  to = "/"
  status = 301

# device.js solo existe en la copia que rsync manda a la Raspberry (lo escribe
# scripts/deploy-signage-pi.sh); en Netlify nunca está. Sin esta regla cae en
# el catch-all de abajo, que responde 200 text/html -> el navegador tira
# "Refused to execute script ... MIME type not executable". Con esto responde
# un 404 real, el <script onerror> lo traga en silencio (comportamiento
# esperado: fuera de la Pi, la pantalla arranca en modo "web"/"preview").
[[redirects]]
  from = "/signage/device.js"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
