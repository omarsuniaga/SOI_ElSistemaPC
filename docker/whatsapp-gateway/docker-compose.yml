version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v2.1.2
    container_name: soi_whatsapp_gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      # Configuración del Servidor Baileys
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Define EVOLUTION_API_KEY en docker/whatsapp-gateway/.env}
      
      # Persistencia de Claves Multi-Device y Sesión WhatsApp
      - DATABASE_PROVIDER=local
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_CHATS=true
      
      # Webhook hacia Supabase Edge Functions
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=https://zmhmdvmyeyswunurcyow.supabase.co/functions/v1/whatsapp-webhook
      - WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS=true
      - WEBHOOK_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_EVENTS_CONNECTION_UPDATE=true
      - WEBHOOK_EVENTS_QRCODE_UPDATED=true
      
      # Heartbeat hacia Supabase
      - HEARTBEAT_ENABLED=true
      - HEARTBEAT_INTERVAL=20000

      # Parámetros Anti-Ban y Rate Limit
      - DELAY_MESSAGE=1000
      - LOG_LEVEL=INFO
    volumes:
      - ./evolution_instances:/evolution/instances
      - ./evolution_store:/evolution/store
