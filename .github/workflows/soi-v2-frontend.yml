name: SOI v2 frontend
on:
  pull_request:
    paths: ['apps/soi-v2/**', '.github/workflows/soi-v2-frontend.yml']
  push:
    branches: ['feat/soi-v2-foundation-demo']
    paths: ['apps/soi-v2/**', '.github/workflows/soi-v2-frontend.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/soi-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/soi-v2/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
